paper:
  slug: secure-triplet-loss-achieving-cancelability-and-non-linkability-in-end
  title: "Secure Triplet Loss: Achieving Cancelability and Non-Linkability in End-to-End Deep Biometrics"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: null
model:
  image_size: 112
  key_dim: 100
  emb_dim: 128
  pretrained: true
train:
  protocol: full
  seed: 42
  num_workers: 4
  batch_size: 32
  epochs: 8
  lr: 0.0001
  weight_decay: 0.001
  margin: 1.0
  gamma: 0.9
eval:
  batch_size: 128
  max_lfw_pairs: null
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  pred_dir: outputs/predictions/full
  figure_dir: outputs/figures/full
device: cuda
