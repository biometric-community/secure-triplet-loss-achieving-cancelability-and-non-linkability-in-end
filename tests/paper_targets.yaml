# Published values from Pinto, Correia & Cardoso, "Secure Triplet Loss: Achieving
# Cancelability and Non-Linkability in End-to-End Deep Biometrics", IEEE TBIOM 3(2),
# 2021, doi:10.1109/TBIOM.2020.3046620. Authors' code: github.com/jtrpinto/SecureTL.
source: doi:10.1109/TBIOM.2020.3046620

# Sec. IV: 100-bit unit-norm keys, gamma 0.9, Adam 1e-4, batch 32.
# margin comes from the authors' face_train_securetl_linkability_model.py.
hyperparameters:
  key_dim: 100
  gamma: 0.9
  margin: 1.0
  lr: 0.0001
  batch_size: 32

# Sec. V-A, face verification EER (%). The linkability term adds about 2 points.
face_eer:
  triplet: 13.99
  secure_tl: 13.61
  with_linkability_max: 16.0

# Sec. V-C, face Dsys.
face_dsys:
  secure_tl: 0.399
  with_kld: 0.132
  with_sl: 0.070
